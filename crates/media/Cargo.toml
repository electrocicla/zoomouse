[package]
name = "zoomouse-media"
version = "0.1.0"
edition = "2021"
description = "Fail-closed Windows GPU media admission and encoder contracts"
license = "MIT"
publish = false

[lib]
name = "zoomouse_media"
path = "src/lib.rs"

[dependencies]
zoomouse-capture = { path = "../capture" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Graphics",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
] }

[lints.rust]
unsafe_code = "deny"
