[package]
name = "zoomouse-host"
version = "0.1.0"
edition = "2021"
description = "Deny-by-default interactive user-session host boundary for Zoomouse"
license = "MIT"
publish = false

[lib]
name = "zoomouse_host"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
getrandom = "0.2"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
