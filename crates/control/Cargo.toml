[package]
name = "zoomouse-control"
version = "0.1.0"
edition = "2021"
description = "Isolated fail-closed Windows input executor foundation"
license = "MIT"
publish = false

[lib]
name = "zoomouse_control"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"
